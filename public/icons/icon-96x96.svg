<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="96" height="96">
  <defs>
    <clipPath id="shieldClip">
      <path d="M256 28C256 28 60 80 60 80C60 80 60 260 60 300C60 400 256 488 256 488C256 488 452 400 452 300C452 260 452 80 452 80C452 80 256 28 256 28Z"/>
    </clipPath>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003893" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#003893" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="#003893"/>
  <circle cx="256" cy="256" r="232" fill="#FFFFFF"/>
  <!-- Shield body -->
  <path d="M256 52C256 52 80 100 80 100C80 100 80 270 80 310C80 405 256 478 256 478C256 478 432 405 432 310C432 270 432 100 432 100C432 100 256 52 256 52Z" fill="#003893" stroke="#002266" stroke-width="4"/>
  <!-- Colombian tricolor bands inside shield -->
  <g clip-path="url(#shieldClip)">
    <!-- Yellow band (top half) -->
    <rect x="60" y="28" width="392" height="200" fill="#FCD116"/>
    <!-- Blue band (quarter) -->
    <rect x="60" y="228" width="392" height="120" fill="#003893"/>
    <!-- Red band (bottom quarter) -->
    <rect x="60" y="348" width="392" height="160" fill="#CE1126"/>
  </g>
  <!-- Shield border overlay -->
  <path d="M256 52C256 52 80 100 80 100C80 100 80 270 80 310C80 405 256 478 256 478C256 478 432 405 432 310C432 270 432 100 432 100C432 100 256 52 256 52Z" fill="none" stroke="#002266" stroke-width="6"/>
  <!-- Inner shield highlight -->
  <path d="M256 68C256 68 96 112 96 112C96 112 96 274 96 310C96 394 256 462 256 462C256 462 416 394 416 310C416 274 416 112 416 112C416 112 256 68 256 68Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- MC Text -->
  <text x="256" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="160" fill="#FFFFFF" stroke="#002266" stroke-width="4" letter-spacing="-5">MC</text>
  <!-- Subtle text shadow for depth -->
  <text x="258" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="160" fill="rgba(0,0,0,0.15)" letter-spacing="-5">MC</text>
  <text x="256" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="160" fill="#FFFFFF" letter-spacing="-5">MC</text>
  <!-- Small star above MC -->
  <polygon points="256,105 264,130 290,130 269,145 277,170 256,155 235,170 243,145 222,130 248,130" fill="#FCD116" stroke="#FFFFFF" stroke-width="2"/>
</svg>